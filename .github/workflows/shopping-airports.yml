name: Liste de courses aéroports - recherche manuelle

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-shopping-airports
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rechercher les scènes réelles et exclure les aéroports possédés
        run: python scripts/discover_shopping_airports.py
      - name: Contrôler le résultat
        run: |
          python - <<'PY'
          import collections,json
          records=json.load(open('public/shopping_airports.json'))
          counts=collections.Counter(x['type'] for x in records)
          assert counts['airport']>=50 and counts['aerodrome']>=50,counts
          assert all(a['shops'] and a['icao'] for a in records)
          print("Liste vérifiée :",dict(counts))
          PY
      - name: Enregistrer et publier le catalogue
        run: |
          git config user.name "journal-msfs-bot"
          git config user.email "journal-msfs-bot@users.noreply.github.com"
          git add data/shopping_airports_catalog.json public/shopping_airports.json
          if git diff --cached --quiet; then
            echo "Catalogue inchangé"
            exit 0
          fi
          git commit -m "Liste de courses : scènes MSFS vérifiées (50+50)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
