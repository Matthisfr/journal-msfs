name: Journal MSFS - actualisation et publication

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: journal-msfs-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le code et les scripts du site
        run: |
          python -m unittest discover -s tests -v
          node --check public/app.js
          node tests/test_frontend.cjs
      - name: Collecter METAR, TAF et annonces officielles
        run: python scripts/update.py
      - name: Récupérer les logos originaux des éditeurs
        run: python scripts/fetch_brand_assets.py
      - name: Construire le tableau statique et la page indépendante
        run: |
          python scripts/build_site.py
          python -c "from pathlib import Path; p=Path('public/index.html').read_text(); a=Path('public/airports.html').read_text(); assert p.count('<tr>')>=171 and a.count('<tr>')>=171; assert 'app.js?rev=' in p; print('Tests statiques : 171 scènes dans les deux pages, JS cache-bust OK')"
      - name: Enregistrer les données vérifiées
        run: |
          git config user.name "journal-msfs-bot"
          git config user.email "journal-msfs-bot@users.noreply.github.com"
          git add public/status.json public/airports.json
          if ! git diff --cached --quiet; then
            git commit -m "Journal: collecte automatique $(date -u +%Y-%m-%d)"
            git push origin HEAD:main || echo "Une modification concurrente a empêché la sauvegarde Git ; la publication continue avec les données fraîchement collectées."
          fi
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
