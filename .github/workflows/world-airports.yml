name: Index mondial des aéroports - mise à jour manuelle

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-world-airports
  cancel-in-progress: false

jobs:
  update-world-index:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Télécharger et vérifier l'index ICAO mondial
        run: python scripts/update_world_airports.py
      - name: Enregistrer l'index dans le dépôt
        run: |
          git config user.name "journal-msfs-bot"
          git config user.email "journal-msfs-bot@users.noreply.github.com"
          git add public/world_airports.json
          if git diff --cached --quiet; then
            echo "Index inchangé : aucune publication nécessaire."
            exit 0
          fi
          git commit -m "Aéroports : actualisation manuelle de l'index mondial ICAO"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Index mondial publié."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Échec de publication de l'index mondial" >&2
          exit 1
