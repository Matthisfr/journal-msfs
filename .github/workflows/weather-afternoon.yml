name: Journal MSFS - météo de 15h (Paris)

on:
  push:
    branches: [main]
    paths:
      - 'data/weather-refresh-request.txt'
  schedule:
    # 15h07 en été (UTC+2) ou en hiver (UTC+1), avec rattrapages.
    - cron: '7 13 * * *'
    - cron: '7 14 * * *'
    - cron: '37 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: journal-msfs-pages
  cancel-in-progress: false

jobs:
  refresh-weather:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Vérifier le créneau français et la fraîcheur météo
        id: gate
        shell: bash
        run: |
          hour=$(TZ=Europe/Paris date +%H)
          if [[ "${{ github.event_name }}" == "schedule" ]] && (( 10#$hour < 15 || 10#$hour > 16 )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          local=ZoneInfo('Europe/Paris')
          now=dt.datetime.now(local)
          path=Path('public/weather_all.json')
          try:
              stamp=dt.datetime.fromisoformat(json.loads(path.read_text())['checked_at'].replace('Z','+00:00')).astimezone(local)
              fresh=stamp.date()==now.date() and (stamp.hour>=15 or (stamp.hour==14 and stamp.minute>=45))
          except (OSError,KeyError,ValueError,TypeError): fresh=False
          run=os.environ.get('EVENT') in ('workflow_dispatch','push') or not fresh
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'run={str(run).lower()}\n')
          print('Collecte météo 15h requise :',run)
          PY
        env:
          EVENT: ${{ github.event_name }}
      - name: Collecter uniquement les METAR et TAF NOAA
        if: steps.gate.outputs.run == 'true'
        run: python scripts/refresh_weather_only.py
      - name: Enregistrer les METAR actualisés
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "journal-msfs-bot"
          git config user.email "journal-msfs-bot@users.noreply.github.com"
          git add public/weather_all.json
          if git diff --cached --quiet; then
            echo "Pas de changement météo à enregistrer"
            exit 0
          fi
          git commit -m "Journal: METAR NOAA actualisés vers 15h (Paris)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "METAR enregistrés sur main ; publication directe à suivre"
              exit 0
            fi
            git fetch origin main
            git rebase -X ours origin/main || exit 1
            sleep 4
          done
          exit 1

      - name: Publier uniquement le fichier météo dans gh-pages
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git fetch origin main gh-pages
          git worktree add --detach "$RUNNER_TEMP/weather-pages" origin/gh-pages
          git show origin/main:public/weather_all.json > "$RUNNER_TEMP/weather-pages/weather_all.json"
          cd "$RUNNER_TEMP/weather-pages"
          git add weather_all.json
          if ! git diff --cached --quiet; then
            git commit -m "Journal: publication météo de 15h"
            git push origin HEAD:gh-pages
          fi
          git fetch origin gh-pages
          git show origin/gh-pages:weather_all.json | python -c 'import json,sys; print("Météo publiée :",json.load(sys.stdin)["checked_at"])'
