name: Recherche manuelle des sources des scènes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnostiquer les sources secondaires
        run: python scripts/probe_sources.py
      - name: Explorer les catalogues et vérifier les fiches produit
        run: python scripts/discover_airports.py
      - name: Conserver le rapport de recherche sans modifier la production
        uses: actions/upload-artifact@v4
        with:
          name: airport-sources-research
          path: public/airport_source_candidates.json
          retention-days: 7
