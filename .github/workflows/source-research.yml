name: Recherche de sources des scènes
on:
  push:
    paths:
      - 'scripts/probe_sources.py'
      - '.github/workflows/source-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les moteurs publics de recherche de produits
        run: python scripts/probe_sources.py
