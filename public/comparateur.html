<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparateur de scènes · Journal MSFS</title><style>body{margin:0;background:#0b1926;color:#e9f2f8;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:22px}a{color:#8cd3ff}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(24px,4vw,38px)}select{font:inherit;padding:12px;border-radius:8px;background:#17374d;color:white;border:1px solid #527c99}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:20px 0}.card{border:1px solid #35556a;border-radius:14px;overflow:hidden;background:#152b3d}.photo{min-height:155px;background:linear-gradient(135deg,#274b66,#10283c);display:grid;place-content:center;text-align:center;padding:12px}.photo span{font-size:40px}.content{padding:16px}.content h2{margin:0}.content p{color:#bfd0df}.verdict{border-left:4px solid #5bbfa1;padding:15px;background:#183c41;border-radius:8px}small{color:#a9bfcc}table{border-collapse:collapse;width:100%;margin-top:18px}td,th{text-align:left;border-bottom:1px solid #345266;padding:12px}button{cursor:pointer}@media(max-width:560px){main{padding:12px}.cards{gap:8px}.content{padding:10px}.content h2{font-size:19px}.photo{min-height:120px}header{align-items:flex-start;flex-direction:column}}</style><main><header><div><small>JOURNAL MSFS · COMPARATEUR DE SCÈNES</small><h1>Deux éditeurs, un aéroport</h1></div><a href="./">← Retour au journal</a></header><label for="airport">Choisir l'aéroport : </label><select id="airport"></select><section id="result"></section><p><small>Prototype : conclusions provisoires. Les photos officielles et les avis sont accessibles via les fiches produits ; aucune image ni note n'est attribuée sans source vérifiée.</small></p></main><script>const records=[["EVRA","Riga","JustSim","1.0.1","https://secure.simmarket.com/justsim-riga-latvia-evra-msfs.phtml","Lisium","1.5.0","https://secure.simmarket.com/lisium-evra-riga-international.phtml","Lisium","Bonne","Les avis précédemment consultés favorisent Lisium pour les détails des terminaux. Vérifier GSX et les FPS."],["LMML","Malte","JustSim","1.3.0","https://secure.simmarket.com/justsim-malta-international-airport-msfs.phtml","iniBuilds","1.0.1","https://inibuilds.com/products/inibuilds-malta-lmml-msfs-2024","iniBuilds","Bonne","Les tests consultés favorisent iniBuilds pour la richesse visuelle. Les performances doivent être testées sur ton installation."],["EDDL","Düsseldorf","Aerosoft","1.0.3","https://www.aerosoft.com/en/shop/flight/microsoft-flight-simulator/msfs-2020/msfs-sceneries/msfs-europe/4547/aerosoft-airport-dusseldorf","MK Studios","1.1.1","https://contrail.shop/products/mk-studios-eddl-dusseldorf-airport-msfs-2020-2024","Partagé","Moyenne","Aerosoft est apprécié pour certains détails d'exactitude, MK Studios pour la finesse des intérieurs. Les avis restent partagés."],["LSZH","Zurich","FSDreamTeam","1.6.8","https://secure.simmarket.com/fsdreamteam-zurich-airport-msfs.phtml","MK Studios","1.1.2","https://contrail.shop/products/mk-studios-lszh-zurich-airport-msfs","MK Studios (visuel)","Moyenne","Plusieurs avis favorisent MK Studios visuellement, mais les retours FPS sont contradictoires."],["LFKJ","Ajaccio","France VFR","1.0.1","https://secure.simmarket.com/france-vfr-lfkj-ajaccio-msfs2420.phtml","Pilot Experience Sim","1.3.2","https://inibuilds.com/products/pilot-experience-sim-ajaccio-lfkj-msfs","Indéterminé","Insuffisante","Pas assez d'avis indépendants pour départager ces deux scènes."]];const select=document.getElementById('airport');const output=document.getElementById('result');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));records.forEach(x=>select.add(new Option(x[0]+' — '+x[1],x[0])));const q=new URLSearchParams(location.search).get('icao');if(records.some(x=>x[0]===q))select.value=q;function render(){const x=records.find(x=>x[0]===select.value);const card=(name,version,url)=>'<article class="card"><div class="photo"><span>📷</span><a href="'+safe(url)+'" target="_blank" rel="noopener noreferrer">Photographies officielles ↗</a></div><div class="content"><h2>'+safe(name)+'</h2><p>Version installée : <b>'+safe(version)+'</b></p><a href="'+safe(url)+'" target="_blank" rel="noopener noreferrer">Fiche produit et avis ↗</a></div></article>';output.innerHTML='<h2>'+safe(x[0])+' — '+safe(x[1])+'</h2><div class="cards">'+card(x[2],x[3],x[4])+card(x[5],x[6],x[7])+'</div><div class="verdict"><strong>Verdict provisoire : '+safe(x[8])+'</strong><p>Confiance : '+safe(x[9])+'</p><p>'+safe(x[10])+'</p></div><table><tr><th>Critère</th><th>'+safe(x[2])+'</th><th>'+safe(x[5])+'</th></tr><tr><td>Performances FPS</td><td>Non mesurées</td><td>Non mesurées</td></tr><tr><td>GSX / passerelles</td><td>À tester</td><td>À tester</td></tr><tr><td>Sources</td><td><a href="'+safe(x[4])+'">Fiche officielle ↗</a></td><td><a href="'+safe(x[7])+'">Fiche officielle ↗</a></td></tr></table>';history.replaceState(null,'','?icao='+encodeURIComponent(x[0]))}select.addEventListener('change',render);render();</script></html>
